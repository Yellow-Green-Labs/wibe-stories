<script>
(function() {
  var btn = document.getElementById('hamburgerBtn');
  var panel = document.getElementById('hamburgerPanel');
  var overlay = document.getElementById('hamburgerOverlay');
  var closeBtn = document.getElementById('hamburgerClose');
  var themeBtn = document.getElementById('hamburgerThemeToggle');
  var versionEl = document.getElementById('hamburgerVersion');

  function openMenu() {
    panel.classList.add('open');
    overlay.classList.add('open');
    btn.setAttribute('aria-expanded', 'true');
  }
  function closeMenu() {
    panel.classList.remove('open');
    overlay.classList.remove('open');
    btn.setAttribute('aria-expanded', 'false');
  }

  btn.addEventListener('click', function() {
    if (panel.classList.contains('open')) closeMenu();
    else openMenu();
  });
  closeBtn.addEventListener('click', closeMenu);
  overlay.addEventListener('click', closeMenu);
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeMenu(); });

  if (themeBtn) {
    themeBtn.addEventListener('click', function() {
      document.documentElement.classList.toggle('dark');
      var isDark = document.documentElement.classList.contains('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      var icon = themeBtn.querySelector('i');
      var label = themeBtn.querySelector('span');
      if (isDark) { icon.className = 'fa-solid fa-sun'; label.textContent = 'Light mode'; }
      else { icon.className = 'fa-solid fa-moon'; label.textContent = 'Dark mode'; }
    });
  }

  fetch('/version.json').then(function(r){return r.json()}).then(function(d){
    if (d.version && versionEl) versionEl.textContent = 'v' + d.version;
  }).catch(function(){});
})();
</script>
