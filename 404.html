<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Page not found. The page you're looking for doesn't exist or has been moved.">
<meta property="og:title" content="404 — Page not found — Wibe Stories">
<meta property="og:description" content="This page doesn't exist. Go back to Wibe Stories home.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Wibe Stories">
<meta property="og:locale" content="en_US">
<meta property="og:image" content="https://wibestories.vercel.app/assets/brand/ws-logo-blwbg.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/png">
<meta property="og:image:alt" content="Wibe Stories — page not found">
<link rel="icon" type="image/x-icon" href="/assets/brand/ws-l-b.ico">
<link rel="canonical" href="https://wibestories.vercel.app/404">
<title>404 — Page not found</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Bricolage Grotesque', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #fffff6;
    color: #1a1a1a;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    user-select: none;
    -webkit-user-select: none;
  }

  /* Grain overlay */
  .grain {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    opacity: 0.08;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 256px 256px;
  }

  .video-bg {
    position: fixed;
    inset: -20px;
    width: calc(100% + 40px);
    height: calc(100% + 40px);
    object-fit: cover;
    z-index: 0;
    transition: transform 0.15s ease-out, filter 0.3s ease;
    -webkit-user-select: none;
    user-select: none;
  }

  .video-bg:hover {
    filter: brightness(1.08) contrast(1.05);
  }

  .overlay {
    position: fixed;
    inset: 0;
    z-index: 4;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 48px 24px 40px;
  }

  .logo-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: start;
    gap: 85px;
    width: 100%;
  }

  .logo {
    max-width: 500px;
    width: 60%;
    height: auto;
    opacity: 0;
    animation: fadeIn 0.8s ease-out forwards;
    transition: transform 0.3s ease;
  }

  .logo:hover {
    transform: scale(1.03);
  }

  .cta {
    display: inline-block;
    padding: 12px 32px;
    background: #f59e0b;
    color: #1a1a1a;
    text-decoration: none;
    font-weight: 600;
    font-size: 25px;
    border-radius: 4px;
    transition: background 0.2s, box-shadow 0.2s;
    opacity: 0;
    animation: slideUp 0.6s ease-out 0.3s forwards;
  }

  .cta:hover {
    background: #e59500;
    box-shadow: 0 4px 20px rgba(245, 158, 11, 0.4);
  }

  .cta:active { transform: scale(0.98); }

  .cta .cta-text {
    display: inline-block;
    transition: transform 0.15s ease-out;
  }

  .bottom {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-bottom: 40px;
  }

  /* 404 text with 3D tilt */
  .code-wrap {
    perspective: 800px;
  }

  .code-link {
    display: inline-block;
    text-decoration: none;
    color: inherit;
  }

  .code {
    font-size: clamp(180px, 10vw, 250px);
    font-weight: 700;
    letter-spacing: -2px;
    line-height: 1;
    color: #1a1a1a;
    position: relative;
    opacity: 0;
    animation: slideUp 0.6s ease-out 0.5s forwards;
    transform-style: preserve-3d;
    transition: transform 0.15s ease-out;
  }

  /* Glitch layers — ON TOP of main text */
  .code::before,
  .code::after {
    content: '404';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
  }

  .code::before {
    color: #f59e0b;
    animation: glitchTop 2s infinite steps(1);
    opacity: 0.85;
    mix-blend-mode: color-dodge;
  }

  .code::after {
    color: #0ea5e9;
    animation: glitchBottom 2s infinite steps(1);
    opacity: 0.85;
    mix-blend-mode: multiply;
  }

  .code:hover::before {
    animation: glitchTopHover 0.4s steps(1) infinite;
    opacity: 1;
    color: #f59e0b;
    mix-blend-mode: color-dodge;
  }

  .code:hover::after {
    animation: glitchBottomHover 0.4s steps(1) infinite;
    opacity: 1;
    color: #0ea5e9;
    mix-blend-mode: multiply;
  }

  .message {
    font-size: clamp(25px, 3vw, 30px);
    font-weight: 400;
    color: #1a1a1a;
    opacity: 0;
    animation: fadeIn 0.6s ease-out 0.7s forwards;
    cursor: default;
    transition: transform 0.15s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Glitch — orange + blue layers */
  @keyframes glitchTop {
    0%, 85%, 100% { clip-path: inset(0); transform: translate(0); }
    86% { clip-path: inset(15% 0 65% 0); transform: translate(-6px, -3px); }
    88% { clip-path: inset(55% 0 15% 0); transform: translate(6px, 3px); }
    90% { clip-path: inset(25% 0 55% 0); transform: translate(-4px, 2px); }
    92% { clip-path: inset(70% 0 5% 0); transform: translate(3px, -2px); }
    94% { clip-path: inset(5% 0 80% 0); transform: translate(-2px, 1px); }
  }

  @keyframes glitchBottom {
    0%, 82%, 100% { clip-path: inset(0); transform: translate(0); }
    83% { clip-path: inset(60% 0 10% 0); transform: translate(5px, 2px); }
    85% { clip-path: inset(20% 0 50% 0); transform: translate(-5px, -2px); }
    87% { clip-path: inset(45% 0 25% 0); transform: translate(4px, -1px); }
    89% { clip-path: inset(80% 0 0% 0); transform: translate(-3px, 3px); }
    91% { clip-path: inset(10% 0 70% 0); transform: translate(2px, -1px); }
  }

  @keyframes glitchTopHover {
    0%, 100% { clip-path: inset(10% 0 70% 0); transform: translate(-10px, -5px); }
    20% { clip-path: inset(50% 0 20% 0); transform: translate(10px, 5px); }
    40% { clip-path: inset(20% 0 50% 0); transform: translate(-8px, 3px); }
    60% { clip-path: inset(70% 0 10% 0); transform: translate(8px, -3px); }
    80% { clip-path: inset(5% 0 75% 0); transform: translate(-6px, 2px); }
  }

  @keyframes glitchBottomHover {
    0%, 100% { clip-path: inset(70% 0 10% 0); transform: translate(10px, 4px); }
    20% { clip-path: inset(30% 0 40% 0); transform: translate(-10px, -4px); }
    40% { clip-path: inset(60% 0 15% 0); transform: translate(7px, -3px); }
    60% { clip-path: inset(5% 0 75% 0); transform: translate(-7px, 5px); }
    80% { clip-path: inset(40% 0 30% 0); transform: translate(5px, -2px); }
  }

  @media (max-width: 720px) {
    .overlay { padding: 32px 16px 32px; }
    .logo { width: 80%; }
    .cta { padding: 10px 24px; font-size: 40px; }
    .bottom { margin-bottom: 80px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .video-bg { display: none; }
    body { background: #fffff6; }
    .logo, .cta, .code, .message { opacity: 1; animation: none; }
    .code::before, .code::after { animation: none; display: none; }
    .cta:hover { transform: none; box-shadow: none; }
    .video-bg:hover { filter: none; }
  }
</style>
</head>
<body>

<div class="grain"></div>

<main>
  <video class="video-bg" id="videoBg" autoplay muted loop playsinline preload="auto" controlsList="nodownload" disablePictureInPicture src="/assets/cards/404.mp4"></video>

  <div class="overlay">
    <div class="logo-wrap">
      <img class="logo" id="logo" src="/assets/brand/WS-HORI-DARK.png" alt="Wibe Stories">
      <a class="cta" id="cta" href="/" aria-label="Go to Wibe Stories home page"><span class="cta-text" id="ctaText">Go to home</span></a>
    </div>
    <div class="bottom">
      <div class="code-wrap" id="codeWrap">
        <a class="code-link" href="https://www.404s.design/" target="_blank" rel="noopener noreferrer" aria-label="View on 404s.design gallery">
          <div class="code" id="code404" aria-hidden="true">404</div>
        </a>
      </div>
      <div class="message">Page not found</div>
    </div>
  </div>
</main>

<script>
  (function() {
    var p = window.location.pathname;
    var logo = document.getElementById('logo');
    var cta  = document.getElementById('cta');
    var ctaText = document.getElementById('ctaText');
    var originalText = 'Go to home';

    if (p.startsWith('/blog/')) {
      logo.src = '/assets/brand/BLOG-LABEL.png';
      logo.alt = 'Wibe & Wonder';
      cta.href = '/blog/';
      originalText = 'Go to blog home';
      ctaText.textContent = originalText;
      cta.setAttribute('aria-label', 'Go to Wibe & Wonder blog home');
    }

    // Mouse parallax on video
    var video = document.getElementById('videoBg');
    var maxOffset = 18;
    document.addEventListener('mousemove', function(e) {
      var x = (e.clientX / window.innerWidth - 0.5) * maxOffset;
      var y = (e.clientY / window.innerHeight - 0.5) * maxOffset;
      video.style.transform = 'translate(' + x + 'px, ' + y + 'px) scale(1.05)';
    });

    // Video protection — prevent download
    video.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    video.addEventListener('dragstart', function(e) { e.preventDefault(); });

    // 3D tilt on 404 text
    var codeWrap = document.getElementById('codeWrap');
    var code404 = document.getElementById('code404');
    codeWrap.addEventListener('mousemove', function(e) {
      var rect = codeWrap.getBoundingClientRect();
      var x = (e.clientX - rect.left) / rect.width - 0.5;
      var y = (e.clientY - rect.top) / rect.height - 0.5;
      code404.style.transform = 'rotateY(' + (x * 15) + 'deg) rotateX(' + (-y * 15) + 'deg)';
    });
    codeWrap.addEventListener('mouseleave', function() {
      code404.style.transform = 'rotateY(0) rotateX(0)';
    });

    // Magnetic pull on logo
    var logoMagneticArea = 120;
    document.addEventListener('mousemove', function(e) {
      var rect = logo.getBoundingClientRect();
      var cx = rect.left + rect.width / 2;
      var cy = rect.top + rect.height / 2;
      var dx = e.clientX - cx;
      var dy = e.clientY - cy;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < logoMagneticArea) {
        var pull = (1 - dist / logoMagneticArea) * 0.15;
        logo.style.transform = 'translate(' + (dx * pull) + 'px, ' + (dy * pull) + 'px)';
      } else {
        logo.style.transform = 'translate(0, 0)';
      }
    });

    // Text scramble on CTA hover
    var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%';
    var scrambleInterval = null;

    cta.addEventListener('mouseenter', function() {
      var iteration = 0;
      var text = originalText;
      clearInterval(scrambleInterval);
      scrambleInterval = setInterval(function() {
        ctaText.textContent = text.split('').map(function(char, i) {
          if (i < iteration) return text[i];
          return chars[Math.floor(Math.random() * chars.length)];
        }).join('');
        if (iteration >= text.length) {
          clearInterval(scrambleInterval);
          ctaText.textContent = text;
        }
        iteration += 1 / 2;
      }, 30);
    });

    cta.addEventListener('mouseleave', function() {
      clearInterval(scrambleInterval);
      ctaText.textContent = originalText;
    });
  })();
</script>

</body>
</html>
